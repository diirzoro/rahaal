name: Deploy Rahaal Test

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: rahaal-test-deploy
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Build Rahaal test image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t "rahaal:test-${SHORT_SHA}" .

      - name: Export Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker save "rahaal:test-${SHORT_SHA}" | gzip > rahaal-test-image.tar.gz

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.TEST_SERVER_SSH_KEY_B64 }}" \
            | base64 -d > ~/.ssh/rahaal_test_key

          chmod 600 ~/.ssh/rahaal_test_key

          ssh-keyscan -H "${{ vars.TEST_SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: |
          ssh \
            -i ~/.ssh/rahaal_test_key \
            "${{ vars.TEST_SERVER_USER }}@${{ vars.TEST_SERVER_HOST }}" \
            "echo SSH_CONNECTION_OK"

      - name: Upload image to server
        run: |
          scp \
            -i ~/.ssh/rahaal_test_key \
            rahaal-test-image.tar.gz \
            "${{ vars.TEST_SERVER_USER }}@${{ vars.TEST_SERVER_HOST }}:/root/rahaal-test-image.tar.gz"

      - name: Deploy Rahaal Test
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          ssh \
            -i ~/.ssh/rahaal_test_key \
            "${{ vars.TEST_SERVER_USER }}@${{ vars.TEST_SERVER_HOST }}" \
            "TEST_IMAGE=rahaal:test-${SHORT_SHA} \
             TEST_CONTAINER='${{ vars.TEST_RAHAAL_CONTAINER }}' \
             TEST_PORT='${{ vars.TEST_RAHAAL_PORT }}' \
             TEST_ENV_FILE='/root/rahaal_env_test' \
             LEGACY_ENV_FILE='${{ vars.TEST_RAHAAL_ENV_FILE }}' \
             LIVE_ENV_FILE='${{ vars.LIVE_RAHAAL_ENV_FILE }}' \
             bash -s" <<'REMOTE'

          set -e

          echo "===== LOAD NEW IMAGE ====="
          gunzip -c /root/rahaal-test-image.tar.gz | docker load

          echo "===== VERIFY IMAGE ====="
          docker image inspect "$TEST_IMAGE" >/dev/null

          echo "===== ENSURE TEST ENV FILE (/root/rahaal_env_test) ====="
          # Bootstrap from the legacy TEST env file ONCE if the explicit test env file is
          # missing (preserves MONGO_URL and other secrets), then enforce TEST-ONLY values.
          # SAFETY: the bootstrap source must NEVER be a Live env file — a copied Live
          # MONGO_URL would silently point the Test container at the LIVE database.
          if [ ! -f "$TEST_ENV_FILE" ]; then
            if [ -n "$LIVE_ENV_FILE" ] && [ "$LEGACY_ENV_FILE" = "$LIVE_ENV_FILE" ]; then
              echo "ERROR: legacy env source equals the Live env file ($LIVE_ENV_FILE) — refusing"
              exit 1
            fi
            case "$LEGACY_ENV_FILE" in
              *live*|*Live*|*LIVE*|/etc/rahaal.env)
                echo "ERROR: refusing to bootstrap Test env from a Live-looking source ($LEGACY_ENV_FILE)"
                exit 1
                ;;
            esac
            if [ -n "$LEGACY_ENV_FILE" ] && [ -f "$LEGACY_ENV_FILE" ]; then
              cp "$LEGACY_ENV_FILE" "$TEST_ENV_FILE"
              echo "Created $TEST_ENV_FILE from legacy TEST source: $LEGACY_ENV_FILE"
            else
              echo "ERROR: $TEST_ENV_FILE not found and no legacy TEST env file available"
              exit 1
            fi
          fi

          echo "===== ENFORCE TEST-ONLY ENV VALUES ====="
          # Never allow Live values inside the Test runtime:
          sed -i '/^NEXT_PUBLIC_BASE_URL=/d' "$TEST_ENV_FILE"
          echo "NEXT_PUBLIC_BASE_URL=https://rahaal-test.targetmediagrp.com" >> "$TEST_ENV_FILE"
          # Explicit PRIMARY switch for the fixed test accounts:
          sed -i '/^SEED_TEST_ACCOUNTS=/d' "$TEST_ENV_FILE"
          echo "SEED_TEST_ACCOUNTS=true" >> "$TEST_ENV_FILE"
          # DISABLE_AUTO_SEED is a Live-only guard — it must NOT block seeding in Test:
          sed -i '/^DISABLE_AUTO_SEED=/d' "$TEST_ENV_FILE"
          chmod 600 "$TEST_ENV_FILE"
          echo "Test env file enforced OK"

          echo "===== REPLACE TEST CONTAINER ====="
          docker rm -f "$TEST_CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$TEST_CONTAINER" \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            --env-file "$TEST_ENV_FILE" \
            -p "127.0.0.1:${TEST_PORT}:3000" \
            "$TEST_IMAGE"

          echo "===== WAIT FOR STARTUP ====="
          sleep 15

          echo "===== VERIFY ENV INSIDE CONTAINER ====="
          SEED_VAL="$(docker exec "$TEST_CONTAINER" printenv SEED_TEST_ACCOUNTS || true)"
          URL_VAL="$(docker exec "$TEST_CONTAINER" printenv NEXT_PUBLIC_BASE_URL || true)"
          echo "SEED_TEST_ACCOUNTS=$SEED_VAL"
          echo "NEXT_PUBLIC_BASE_URL=$URL_VAL"
          if [ "$SEED_VAL" != "true" ]; then
            echo "ERROR: SEED_TEST_ACCOUNTS did not reach the container"
            exit 1
          fi
          if [ "$URL_VAL" != "https://rahaal-test.targetmediagrp.com" ]; then
            echo "ERROR: NEXT_PUBLIC_BASE_URL inside container is not the Test URL"
            exit 1
          fi
          echo "CONTAINER ENV OK"

          echo "===== HEALTH CHECK ====="
          curl -fsS "http://127.0.0.1:${TEST_PORT}/" >/dev/null
          # Hit an API route too — this triggers the server init (incl. test-account seeding)
          curl -fsS "http://127.0.0.1:${TEST_PORT}/api/health" >/dev/null

          echo "===== REMOVE TRANSFER FILE ====="
          rm -f /root/rahaal-test-image.tar.gz

          echo "===== CLEAN OLD TEST IMAGES ====="
          docker images \
            --format '{{.Repository}}:{{.Tag}}' \
            | grep '^rahaal:test-' \
            | grep -v "^${TEST_IMAGE}$" \
            | xargs -r docker image rm || true

          echo "===== FINAL TEST STATE ====="
          docker ps \
            --filter "name=${TEST_CONTAINER}" \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

          echo "RAHAAL TEST DEPLOY SUCCESS"

          REMOTE

      - name: Public Health Check (rahaal-test.targetmediagrp.com)
        run: |
          echo "===== PUBLIC HEALTH CHECK ====="
          for i in {1..12}; do
            code=$(curl -ksS -o /dev/null -w "%{http_code}" https://rahaal-test.targetmediagrp.com || true)
            echo "Attempt ${i}/12 → HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Rahaal Test public health OK"
              exit 0
            fi
            sleep 5
          done
          echo "Rahaal Test public health FAILED"
          exit 1

      - name: Test Accounts Login Check (owner@gmail.com / taha@gmail.com)
        run: |
          echo "===== TEST ACCOUNTS LOGIN CHECK ====="
          for acct in owner@gmail.com taha@gmail.com; do
            ok=""
            for i in {1..6}; do
              code=$(curl -ksS -o /tmp/login_resp.json -w "%{http_code}" \
                -X POST "https://rahaal-test.targetmediagrp.com/api/auth/login" \
                -H "Content-Type: application/json" \
                -d "{\"email\":\"${acct}\",\"password\":\"123456\"}" || true)
              echo "${acct} attempt ${i}/6 → HTTP ${code}"
              if [ "$code" = "200" ]; then
                ok="yes"
                break
              fi
              sleep 5
            done
            if [ "$ok" != "yes" ]; then
              echo "LOGIN FAILED for ${acct}"
              cat /tmp/login_resp.json || true
              exit 1
            fi
          done
          echo "TEST ACCOUNTS LOGIN OK (owner + user)"

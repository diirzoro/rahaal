name: Deploy Rahaal Test

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: rahaal-test-deploy
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Build Rahaal test image
        run: |
          TAG="test-${GITHUB_SHA::7}"
          docker build -t "rahaal:${TAG}" .

      - name: Export Docker image
        run: |
          TAG="test-${GITHUB_SHA::7}"
          docker save "rahaal:${TAG}" | gzip > rahaal-test-image.tar.gz

      - name: Upload image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TEST_SERVER_HOST }}
          username: ${{ vars.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "rahaal-test-image.tar.gz"
          target: "/root/"

      - name: Deploy to fixed Rahaal test environment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.TEST_SERVER_HOST }}
          username: ${{ vars.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            set -e

            TAG="test-${{ github.sha }}"
            SHORT_TAG="test-$(echo '${{ github.sha }}' | cut -c1-7)"
            IMAGE="rahaal:${SHORT_TAG}"

            echo "===== LOAD NEW IMAGE ====="
            gunzip -c /root/rahaal-test-image.tar.gz | docker load

            echo "===== REMOVE OLD TEST CONTAINER ====="
            docker rm -f "${{ vars.TEST_RAHAAL_CONTAINER }}" 2>/dev/null || true

            echo "===== START NEW TEST CONTAINER ====="
            docker run -d \
              --name "${{ vars.TEST_RAHAAL_CONTAINER }}" \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              --env-file "${{ vars.TEST_RAHAAL_ENV_FILE }}" \
              -p 127.0.0.1:${{ vars.TEST_RAHAAL_PORT }}:3000 \
              "$IMAGE"

            echo "===== WAIT ====="
            sleep 15

            echo "===== HEALTH CHECK ====="
            curl -fsS "http://127.0.0.1:${{ vars.TEST_RAHAAL_PORT }}/" >/dev/null

            echo "===== CLEAN TEMP FILE ====="
            rm -f /root/rahaal-test-image.tar.gz

            echo "===== REMOVE OLD TEST IMAGES ONLY ====="
            docker images 'rahaal:test-*' \
              --format '{{.Repository}}:{{.Tag}}' \
              | grep -v "^${IMAGE}$" \
              | xargs -r docker image rm || true

            echo "===== RESULT ====="
            docker ps --filter "name=${{ vars.TEST_RAHAAL_CONTAINER }}"

            echo "RAHAAL TEST DEPLOY SUCCESS"

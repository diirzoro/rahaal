name: Apply Rahaal targeted UI fixes
on:
  push:
    branches:
      - fix-admin-print-auth-ui-181026
    paths:
      - scripts/_temp_patch_targeted.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-admin-print-auth-ui-181026
      - name: Apply patch
        run: python3 scripts/_temp_patch_targeted.py
      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Build
        run: yarn build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_inspect_targeted_fixes.yml scripts/_temp_patch_targeted.py
          git add app/page.js
          git commit -m "Fix package labels, supplier privacy, and password reset UI"
          git push origin HEAD:fix-admin-print-auth-ui-181026

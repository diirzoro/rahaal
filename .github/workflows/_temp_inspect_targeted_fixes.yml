name: Inspect Rahaal targeted fixes
on:
  push:
    branches: [fix-admin-print-auth-ui-181026]
    paths:
      - .github/workflows/_temp_inspect_targeted_fixes.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted code
        shell: bash
        run: |
          set -e
          echo '=== ADMIN BINDING ==='
          grep -n -C 14 -E 'AdminBindingRequiredNotice|غير مربوط|دفتر شركة رحال|دفتر.*رحال|tenant_id' app/page.js | head -n 260 || true
          echo '=== PACKAGE LABELS ==='
          grep -n -C 8 -E 'الباقات|البرامج|الباكجات' app/page.js | head -n 320 || true
          echo '=== PRINT SUPPLIER ==='
          grep -n -C 12 -E 'printVoucher|supplier_name|اسم المورد|المورد:|الوكيل:' app/page.js | head -n 520 || true
          echo '=== AUTH ROUTES ==='
          grep -n -C 14 -E 'login|signup|register|forgot|reset|verify|verification|password' 'app/api/[[...path]]/route.js' | head -n 520 || true
          echo '=== SIGNUP FILES ==='
          find app/signup -maxdepth 3 -type f -print
          for f in $(find app/signup -maxdepth 3 -type f); do
            echo "--- $f ---"
            grep -n -C 12 -E 'email|password|verify|login|signup|register|نسيت|تحقق' "$f" | head -n 260 || true
          done

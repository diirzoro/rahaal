name: Inspect Rahaal targeted fixes
on:
  push:
    branches: [fix-admin-print-auth-ui-181026]
    paths:
      - .github/workflows/_temp_inspect_targeted_fixes.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact print/package/auth regions
        shell: bash
        run: |
          echo '=== PRINT_VOUCHER_RANGE ==='
          sed -n '4252,4415p' app/page.js
          echo '=== PACKAGE_PRINT_RANGE ==='
          sed -n '9300,10250p' app/page.js | grep -n -C 18 -E 'print|طباعة|supplier|المورد|الوكيل|window.open|openPrint' | head -n 700 || true
          echo '=== LOGIN_FORGOT_RANGE ==='
          sed -n '245,370p' app/page.js
          echo '=== ROUTE_IMPORTS ==='
          sed -n '1,90p' 'app/api/[[...path]]/route.js'
          echo '=== SIGNUP_FULL ==='
          cat app/signup/page.js
